<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clay pointer regression fixture</title><link rel="icon" href="data:,"></head><body style="margin:0"><div id="fixture" style="margin:20px"></div><script type="module">
import { mountLab } from '@zachshotamartin/graphics-workbench';
import '@zachshotamartin/graphics-workbench/style.css';
import { createExperiment } from '../src/index.js';
window.addEventListener('pointerdown', event => { window.lastPointerId = event.pointerId; }, true);
window.lab = mountLab(document.querySelector('#fixture'), ctx => { window.clayTool = createExperiment(ctx); return window.clayTool; });
window.clayMesh = window.lab.ctx.root.getObjectByName('Sculpted clay');
window.vertices = () => Array.from(window.clayMesh.geometry.attributes.position.array);
</script></body></html>
